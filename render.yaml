# Render Blueprint: backend API as a Docker web service (free plan).
# Render → New → Blueprint → pick this repo. Secrets marked sync:false are entered in the dashboard.
services:
  - type: web
    name: careerlens-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB
        value: career_intelligence
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBED_MODEL
        value: text-embedding-3-small
      # Behind Cloudflare Pages + Render's router. Safe ONLY together with PROXY_SECRET:
      # the API rejects requests that did not come through the Pages proxy, so the client IP
      # the proxy forwards (from cf-connecting-ip) cannot be spoofed by direct callers.
      - key: TRUST_PROXY_HOPS
        value: '2'
      - key: PROXY_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: careerlens-docs
